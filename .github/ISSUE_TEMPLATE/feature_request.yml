name: Feature Request
description: Suggest an idea or enhancement for the hotel system
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that the system doesn't support?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (Spring Boot API)
        - Frontend (React UI)
        - Database / scripts
        - Documentation
        - Other
    validations:
      required: true
