# Server Configuration
server.port=8081

# Local secrets loaded from backend/.env (gitignored) if present.
# Copy .env.example to .env and fill in real values.
spring.config.import=optional:file:./.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hasmir_hotels_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
# HS256 requires at least a 32-byte (256-bit) secret
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.hasmirhotels=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=INFO
